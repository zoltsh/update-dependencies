name: Bug report
description: Report a reproducible problem that is not a security vulnerability
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use private vulnerability reporting.
  - type: input
    id: ref
    attributes:
      label: Action ref
      description: Full commit SHA or immutable version tag
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner
      placeholder: ubuntu-24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal workflow and repository shape, with all secrets removed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
