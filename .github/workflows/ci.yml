name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dependencies-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin="$RUNNER_TEMP/actionlint-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      - name: Check repository
        run: scripts/check

      - name: Check workflows
        run: actionlint

      - name: Check dependency vulnerabilities
        run: npm audit

      - name: Check clean generated state
        run: git diff --exit-code

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  integration:
    name: runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and runtime contracts
        env:
          EXPECTED_ZOLT_TARGET: ${{ matrix.target }}
        run: npm run platform:check && npm run typecheck && npm test && npm run bundle:check

      - name: Verify pinned Zolt schema-v2 contract
        env:
          EXPECTED_ZOLT_TARGET: ${{ matrix.target }}
        run: npm run pinned-zolt:check

  zolt-source-contract:
    name: exact-target source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out reviewed Zolt source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zoltsh/zolt
          ref: ae6532ef804c6347c6b1e72742216b9443c6c288
          path: zolt-source
          persist-credentials: false

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f
        with:
          distribution: graalvm
          java-version: "21"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked action dependencies
        run: npm ci

      - name: Package reviewed Zolt source
        working-directory: zolt-source
        run: |
          scripts/bootstrap-zolt-jvm --no-progress toolchain sync
          scripts/bootstrap-zolt-jvm --no-progress package --workspace --member apps/zolt --cache-root .zolt/cache

      - name: Compile contract tests
        run: node scripts/build-tests.mjs

      - name: Verify exact-target source contract
        env:
          ZOLT_LIVE_BINARY: ${{ github.workspace }}/zolt-source/scripts/run-zolt-built
          ZOLT_LIVE_SOURCE_COMMIT: ae6532ef804c6347c6b1e72742216b9443c6c288
        run: node --test --test-reporter spec dist-test/test/live-zolt-contract.test.js

  windows-negative:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject Windows before installation
        id: update
        continue-on-error: true
        uses: ./

      - name: Require a closed failure
        shell: pwsh
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          if ($env:UPDATE_OUTCOME -ne "failure") {
            throw "The action unexpectedly accepted a Windows runner."
          }
